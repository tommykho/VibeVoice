[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vibevoice"
version = "1.0.0"
authors = [
  { name="vibevoice team", email="VibeVoice@microsoft.com" },
]
description = "Open-Source Frontier Voice AI."
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    # "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    # torch 2.10 rejects the BaseModelOutputWithPast inside the .pt voice presets.
    "torch<2.10",
    "transformers>=4.51.3,<5.0.0",
    "accelerate",
    "diffusers",
    "tqdm",
    "numpy",
    "librosa",
]


[project.optional-dependencies]
streamingtts = [
  "transformers==4.51.3",
]
demos = [
  "gradio",
  "av",
  "aiortc",
  "uvicorn[standard]",
  "fastapi",
  "pydub",
]

[project.entry-points."vllm.general_plugins"]
vibevoice = "vllm_plugin:register_vibevoice"

[project.urls]
"Homepage" = "https://github.com/microsoft/VibeVoice"
"Bug Tracker" = "https://github.com/microsoft/VibeVoice/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["vibevoice*", "vllm_plugin*"]
